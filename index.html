  const L=toks.slice(0,i), R=toks.slice(i+1); if(!L.length||!R.length) return {err:"Put something on both sides of the = sign."};
  let l,r; try{l=parseFormula(tokSrc(L))}catch(e){return {err:friendlyParse(e.message,"left")}} try{r=parseFormula(tokSrc(R))}catch(e){return {err:friendlyParse(e.message,"right")}}
  return {l,r}}
function friendlyParse(m,side){return /never closed|Close the bracket/.test(m)?`A bracket on the ${side} side is opened but never closed.`:/ends too early/.test(m)?`The ${side} side ends with an operation. What comes after it?`:
  /wrong place|Unexpected/.test(m)?`Something on the ${side} side is out of order: check for two operations in a row, or a bracket in the wrong place.`:m}
function eqPoints(spec,keys,seed,given){const R=mulberry32(seed), pts=[];
  for(let i=0;i<9;i++){const e={}; keys.forEach(k=>{const y=spec.SY[k]||{};
      if(given&&y.role==="par"&&y.val!=null){e[k]=y.val; return}
      let lo,hi; if(y.range){[lo,hi]=y.range} else if(y.val!=null&&y.val!==0){lo=Math.abs(y.val)*.4; hi=Math.abs(y.val)*1.6} else {lo=.5; hi=12}
      e[k]=lo+(hi-lo)*(.08+.84*R())}); pts.push(e)}
  return pts}
const same=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<=1e-7*Math.max(1,Math.abs(a),Math.abs(b));
function equivalent(spec,a,b,keys,given,seed=7){let any=0; for(const e of eqPoints(spec,keys,seed,given)){const x=safeEval(a,e), y=safeEval(b,e);
    if(!Number.isFinite(x)&&!Number.isFinite(y)) continue; if(!same(x,y)) return false; any++} return any>=3}
function eqCheck(spec,e,toks){const SY=spec.SY, sp=eqSplit(toks); if(sp.err) return {fb:sp.err};
  let lhs=sp.l, rhs=sp.r;
  if(!(lhs.v===e.out)&&rhs.v===e.out){const t=lhs; lhs=rhs; rhs=t}
  if(!lhs.v) return {fb:`The left side should be just the symbol for what the equation works out: ${symHTML(e.out,SY)}.`};
  if(lhs.v!==e.out){const y=SY[lhs.v]; return {fb:y&&y.role==="out"?`That's the equation for ${symHTML(lhs.v,SY)}. This one is for ${symHTML(e.out,SY)}.`:`The left side should be what the equation works out, ${symHTML(e.out,SY)}. ${y?`${symHTML(lhs.v,SY)} is “${esc(y.name)}”.`:""}`}}
  const tgt=parseFormula(e.f), tv=[...formulaVars(tgt)], uv=[...formulaVars(rhs)];
  if(uv.includes(e.out)) return {fb:`${symHTML(e.out,SY)} can't be on both sides. The right side says how to work it out from the other symbols.`};
  const extra=uv.find(k=>!tv.includes(k)); if(extra){const y=SY[extra]; return {fb:`Your equation uses ${symHTML(extra,SY)}${y?` (${esc(y.name)})`:""}. Does ${symHTML(e.out,SY)} depend on it?`}}
  const keys=[...new Set(tv.concat(uv))];
  if(equivalent(spec,rhs,tgt,keys,false)) return {ok:true,lhs,rhs};
  for(const mk of e.mistakes||[]){try{if(equivalent(spec,rhs,parseFormula(mk.f),keys,false)) return {fb:rich(mk.fb,SY)}}catch(err){}}
  if(equivalent(spec,rhs,tgt,keys,true)){const miss=tv.filter(k=>!uv.includes(k)&&SY[k]&&SY[k].role==="par");
    return {fb:`This works with these numbers, but write it with the symbols${miss.length?` (${miss.map(k=>symHTML(k,SY)).join(", ")})`:""} so it works for any values. You'll put the numbers in during the final steps.`}}
  const miss=tv.find(k=>!uv.includes(k)); if(miss){const y=SY[miss]; return {fb:`Your equation doesn't use ${symHTML(miss,SY)}${y?` (${esc(y.name)})`:""}. Where does it come in?`}}
  const pt={}; keys.forEach(k=>{const y=SY[k]||{}; pt[k]=y.val!=null?y.val:y.story!=null?y.story:y.range?y.range[0]+(y.range[1]-y.range[0])/3:2});
  const a=safeEval(rhs,pt), b=safeEval(tgt,pt), u=(SY[e.out]||{}).unit||"", show=x=>Number.isFinite(x)?fmtM(+x.toPrecision(5))+(u&&u!=="$"?" "+u:""):"no number";
  const where=keys.filter(k=>SY[k]&&SY[k].role==="in").map(k=>`${symHTML(k,SY)} = ${fmtM(+pt[k].toPrecision(4))}`).join(", ");
  return {fb:`Check it with numbers${where?` (${where})`:""}: your right side gives ${u==="$"?"$":""}${show(a)}, but ${symHTML(e.out,SY)} should be ${u==="$"?"$":""}${show(b)}. Compare each part with your blocks.`}}

/* ---------- the step ---------- */
function equationStep(el,m,st,ctx,spec){
  const d=st.d, SY=spec.SY, prog=d.prog||{body:[]};
  const E=d.eq||(d.eq={}); E.sym=E.sym||{}; E.ok=E.ok||{}; E.tok=E.tok||{}; E.draft=E.draft||{}; E.q=E.q||{}; E.sv=E.sv||{at:0,fin:false,ans:{},ip:null};
  const symsOK=()=>spec.syms.every(k=>E.sym[k]===k), eqsOK=()=>spec.eqs.every(e=>E.ok[e.out]);
  const qOK=q=>{const i=E.q[q.id]; return i!=null&&!!(q.opts[i]&&q.opts[i].ok)}, whyOK=()=>spec.why.every(qOK);
  const sv=spec.solve, solveOK=()=>E.sv.at>=sv.steps.length&&E.sv.fin&&(!sv.interp||(E.sv.ip!=null&&sv.interp.opts[E.sv.ip]&&sv.interp.opts[E.sv.ip].ok));
  const open=[()=>true,()=>S.teacher||symsOK(),()=>S.teacher||(symsOK()&&eqsOK()),()=>S.teacher||(symsOK()&&eqsOK()&&whyOK())];
  const order=[...spec.syms].sort((a,b)=>((a.length*7919+a.charCodeAt(0)*31)%97)-((b.length*7919+b.charCodeAt(0)*31)%97));
  const vlab={}; spec.syms.concat(Object.keys(SY)).forEach(k=>{if(SY[k]&&SY[k].lab) vlab[k]={label:SY[k].lab}});
  let symFb="";
  el.innerHTML=`<div class="eqstep">${spec.intro?`<p class="lead eqintro">${rich(spec.intro,SY)}</p>`:""}${spec.note?`<div style="margin-top:2rem">${teacherNote(spec.note)}</div>`:""}
    <div class="card esec" id="es1"></div><div class="card esec" id="es2"></div><div class="card esec" id="es3"></div><div class="card esec" id="es4"></div>
    <div class="ex-btns" style="margin-left:0"><button class="btn back" id="back">${ic("arrowL",2.8)}Build</button><button class="btn submit" id="nextb" disabled>Test ${ic("arrowR",2.8)}</button></div></div>`;
  const head=(n,title,done,sub)=>`<div class="esh"><span class="enum ${done?"ok":""}">${done?ic("check",2.6):n}</span><h2>${title}</h2>${done?`<span class="pill easy">Done</span>`:""}</div>${sub?`<p class="lead">${sub}</p>`:""}`;
  const locked=(box,n,title,why)=>{box.className="card esec locked"; box.innerHTML=`<div class="esh"><span class="enum">${n}</span><h2>${title}</h2></div><p class="elock">${ic("lock",2.2)}${why}</p>`};
  const meta=k=>{const y=SY[k]||{}, u=y.unit?esc(y.unit):"";
    return y.role==="in"?`${u?u+" · ":""}you slide it`:y.role==="par"?`given: ${esc(y.show||fmtM(y.val))}${u&&!y.show?" "+u:""}`:`${u?u+" · ":""}the model works it out`};

  /* 1 · symbols */
  function sec1(){const box=$("#es1",el), done=symsOK(); box.className="card esec"+(done?" done":"");
    box.innerHTML=head(1,"Know your symbols",done,"Each symbol in an equation stands for one quantity. Match every symbol to what it means. The pink chip is the same quantity's block.")+
      `<div class="symgrid">${spec.syms.map(k=>{const ch=E.sym[k], ok=ch===k;
        return `<div class="symrow ${ok?"ok":ch?"bad":""}"><span class="symbig${String(k).replace(/_/g,"").length>6?" sm":""}">${symHTML(k,SY)}</span><span class="symblk"><span class="bk">${esc(SY[k]&&SY[k].lab||k)}</span></span>
          <select class="field sm" data-sym="${esc(k)}" aria-label="What ${esc(k)} means" ${ok&&!S.teacher?"disabled":""}><option value="">Choose what it means…</option>${order.map(o=>`<option value="${esc(o)}" ${ch===o?"selected":""}>${esc(SY[o].name)}</option>`).join("")}</select>
          <span class="symmeta">${ok?`${ic("check",2.2)}${meta(k)}`:""}</span></div>`}).join("")}</div><p class="fb ${symFb?"warn":""}" id="symfb">${symFb}</p>`;
    $$("[data-sym]",box).forEach(s=>s.onchange=()=>{const k=s.dataset.sym, v=s.value; E.sym[k]=v; st.runs=(st.runs||0)+1;
      symFb=!v||v===k?"":`Not quite: “${esc(SY[v].name)}” is ${symHTML(v,SY)}, not ${symHTML(k,SY)}. Open Problem info to check what each quantity means.`;
      if(symsOK()) symFb=""; save(); const was=done; sec1(); if(!was&&symsOK()){celebrate($("#es1 .enum",el)); sec2(); sec3(); sec4()} refresh()})}

  /* 2 · equations */
  const tilesFor=e=>e.tiles||spec.tiles;
  const tileCls=t=>TOK_OP[t]||t==="ln("?"op":isNumTok(t)?"num":"sym";
  const tileLab=t=>({"+":"plus","-":"minus","*":"times","/":"divided by","^":"to the power of","(":"open bracket",")":"close bracket","=":"equals","ln(":"natural log"})[t]||(isNumTok(t)?t:`symbol ${t}`);
  function eqHints(e){const tgt=parseFormula(e.f), b=blockFor(prog,e.out), keys=[...formulaVars(tgt)], bOK=b&&(()=>{try{return equivalent(spec,b,tgt,[...new Set(keys.concat([...formulaVars(b)]))],false)}catch(err){return false}})();
    const h3=bOK?`Your blocks for ${symHTML(e.out,SY)} already say this:<span class="hline">${symHTML(e.out,SY)}<span class="mo mrel">=</span>${mathHTML(b,SY)}</span>Build the same thing with the tiles. Each Math block becomes its sign, a ÷ block can be a fraction, and a ^ block puts its right side up in the exponent.`:
      `The equation is:<span class="hline">${lineHTML(e.out+" = "+e.f,SY)}</span>Build it with the tiles, one symbol or sign at a time.`;
    return (e.hints||[]).slice(0,2).map(h=>rich(h,SY)).concat([h3])}
  function sec2(){const box=$("#es2",el); if(!open[1]()) return locked(box,2,"Write the equations","Match the symbols first.");
    const done=eqsOK(); box.className="card esec"+(done?" done":"");
    box.innerHTML=head(2,"Write the equations",done,spec.buildLead||"Turn your blocks into equations. Tap the tiles to build each one: the symbol for what it works out, then =, then how it's worked out. Tap inside your equation to move the cursor.")+
      `<div class="egrid"><div class="ebuilds">${spec.eqs.map((e,i)=>`<div class="eqb ${E.ok[e.out]?"ok":""}" id="eqb${i}"></div>`).join("")}</div>
       <aside class="eblocks"><div class="ebh">${ic("code",2.2)}<b>Your blocks</b></div>${blocksHTML()}</aside></div>`;
    spec.eqs.forEach((e,i)=>mountEq(e,i))}
  function blocksHTML(){const body=(prog&&prog.body)||[]; if(!body.length) return `<p class="muted ebmt">The blocks you build show up here, to help you write each equation.</p>`;
    const hat=m.id==="fire"?`<div class="blk hat fhat"><i class="hf"></i>${FLAG}<span>each step, every square writes to</span><span class="bsel fake">${d.mode==="inplace"?"the same forest":d.mode==="next"?"a fresh copy":"(not chosen)"}</span></div>`:HAT;
    return `<div class="canvasbox card ro ebcv"><div class="script">${hat}<div class="stack root">${body.map(n=>rNode(n,{pal:true,show:true,vars:vlab,menus:()=>[]})).join("")}</div></div></div>`}
  function mountEq(e,i){const box=$("#eqb"+i,el), ok=!!E.ok[e.out];
    const top=`<div class="eqbh"><span class="eqfor">Equation for ${symHTML(e.out,SY)}</span><span class="muted">${esc(SY[e.out].name)}</span></div>`;
    if(ok){box.innerHTML=top+`<div class="eqdone">${ic("check",2.6)}${eqView(E.tok[e.out])}</div>${e.after?`<p class="eqafter">${rich(e.after,SY)}</p>`:""}`; return}
    let toks=(E.draft[e.out]||[]).slice(), caret=toks.length;
    box.innerHTML=top+`<div class="eqline" tabindex="0" role="group" aria-label="Your equation for ${esc(e.out)}. Backspace deletes, arrow keys move the cursor."></div>
      <div class="eqprev" aria-live="polite"></div>
      <div class="eqtray" role="group" aria-label="Tiles">${tilesFor(e).map(t=>`<button type="button" class="etile ${tileCls(t)}" data-t="${esc(t)}" aria-label="Add ${esc(tileLab(t))}">${tokHTML(t,SY)}</button>`).join("")}</div>
      <div class="eqbtns"><button type="button" class="btn sm white" data-bs>${ic("arrowL",2.2)}Delete</button><button type="button" class="btn sm white" data-clr>${ic("x",2.2)}Clear</button><button type="button" class="btn sm" data-chk>${ic("check",2.4)}Check</button></div>
      <p class="fb eqfb"></p><div class="hintzone"></div>`;
    const line=$(".eqline",box), prev=$(".eqprev",box), fb=$(".eqfb",box), hz=$(".hintzone",box);
    const keep=()=>{E.draft[e.out]=toks.slice(); save()};
    const draw=()=>{line.innerHTML=(toks.length?toks.map((t,j)=>`${j===caret?'<i class="ecaret" aria-hidden="true"></i>':""}<button type="button" class="etok ${tileCls(t)}" data-j="${j}" tabindex="-1" aria-label="${esc(tileLab(t))}">${tokHTML(t,SY)}</button>`).join("")+(caret===toks.length?'<i class="ecaret" aria-hidden="true"></i>':""):
        `<i class="ecaret" aria-hidden="true"></i><span class="eqph">Tap the tiles below</span>`);
      if(!toks.length){prev.innerHTML=""; return}
      const sp=eqSplit(toks); let h="";
      if(!sp.err) h=`${mathHTML(sp.l,SY)}<span class="mo mrel">=</span>${mathHTML(sp.r,SY)}`;
      else if(toks.indexOf("=")<0){try{h=mathHTML(parseFormula(tokSrc(toks)),SY)}catch(err){h=""}}
      prev.innerHTML=h?`<span class="eqpl">Reads as</span><span class="mline">${h}</span>`:`<span class="eqpl">Reads as</span><span class="muted">… keep going</span>`};
    const put=t=>{toks.splice(caret,0,t); caret++; fb.textContent=""; fb.className="fb eqfb"; keep(); draw()};
    const del=()=>{if(caret>0){toks.splice(caret-1,1); caret--; keep(); draw()}};
    $$(".etile",box).forEach(b=>b.onclick=()=>{put(b.dataset.t); line.focus({preventScroll:true})});
    line.addEventListener("click",ev=>{const tk=ev.target.closest(".etok"); caret=tk?+tk.dataset.j+1:toks.length; draw(); line.focus({preventScroll:true})});
    line.addEventListener("keydown",ev=>{const k=ev.key, map={"+":"+","-":"-","*":"*","x":"*","/":"/","^":"^","(":"(",")":")","=":"="};
      if(k==="Backspace"){ev.preventDefault(); del()} else if(k==="Delete"){ev.preventDefault(); if(caret<toks.length){toks.splice(caret,1); keep(); draw()}}
      else if(k==="ArrowLeft"){ev.preventDefault(); caret=Math.max(0,caret-1); draw()} else if(k==="ArrowRight"){ev.preventDefault(); caret=Math.min(toks.length,caret+1); draw()}
      else if(k==="Home"){ev.preventDefault(); caret=0; draw()} else if(k==="End"){ev.preventDefault(); caret=toks.length; draw()}
      else if(map[k]&&tilesFor(e).includes(map[k])){ev.preventDefault(); put(map[k])} else if(k==="Enter"){ev.preventDefault(); check()}});
    $("[data-bs]",box).onclick=del; $("[data-clr]",box).onclick=()=>{toks=[]; caret=0; keep(); draw(); fb.textContent=""};
    const check=()=>{st.runs=(st.runs||0)+1; const r=eqCheck(spec,e,toks);
      if(r.ok){E.ok[e.out]=true; E.tok[e.out]=toks.slice(); delete E.draft[e.out]; save(); box.classList.add("ok"); const all=eqsOK(); mountEq(e,i); celebrate($(".eqdone",box)||box,14);
        if(all){sec2(); sec3(); sec4()} refresh(); return}
      fb.className="fb warn eqfb"; fb.innerHTML=r.fb; save()};
    $("[data-chk]",box).onclick=check;
    draw(); goalHints(hz,st,{k:"eq-"+e.out,hints:eqHints(e)})}
  const eqView=toks=>{const sp=eqSplit(toks||[]); return sp.err?`<span class="mline">${(toks||[]).map(t=>tokHTML(t,SY)).join(" ")}</span>`:`<span class="mline">${mathHTML(sp.l,SY)}<span class="mo mrel">=</span>${mathHTML(sp.r,SY)}</span>`};

  /* 3 · why the equation looks like that */
  function qHTML(q,sel,name){const pk=sel!=null?q.opts[sel]:null, ok=!!(pk&&pk.ok);
    return `<div class="qq ${ok?"ok":""}"><p class="qtext">${rich(q.q,SY)}</p>
      <div class="choices" role="radiogroup">${q.opts.map((o,j)=>`<button type="button" class="choice ${sel===j?(o.ok?"right":"wrong"):""}" role="radio" aria-checked="${sel===j}" data-${name}="${j}" data-qid="${esc(q.id)}" ${ok&&!S.teacher?"disabled":""}><span class="k">${"ABCD"[j]}</span><span>${rich(o.h,SY)}</span></button>`).join("")}</div>
      ${pk?`<p class="fb ${ok?"good":"warn"} qfb">${rich(ok?(pk.why||"Right."):(pk.fb||"Not quite. Try another answer."),SY)}</p>`:""}</div>`}
  function sec3(){const box=$("#es3",el); if(!open[2]()) return locked(box,3,"Make sense of the equations","Write the equations first.");
    const done=whyOK(); box.className="card esec"+(done?" done":"");
    box.innerHTML=head(3,"Make sense of the equations",done,"An equation is only useful if you know why it has that shape. Pick an answer: each one tells you why it's right or what's missing.")+
      `<div class="qlist">${spec.why.map(q=>qHTML(q,E.q[q.id],"qo")).join("")}</div>`;
    $$("[data-qo]",box).forEach(b=>b.onclick=()=>{const was=whyOK(); E.q[b.dataset.qid]=+b.dataset.qo; st.runs=(st.runs||0)+1; save(); const y=$(`[data-qid="${CSS.escape(b.dataset.qid)}"]`,box).closest(".qq").getBoundingClientRect().top;
      sec3(); const q2=$$(".qq",box).find(x=>x.querySelector(`[data-qid="${CSS.escape(b.dataset.qid)}"]`)); if(q2) scrollBy(0,q2.getBoundingClientRect().top-y);
      if(!was&&whyOK()){celebrate($("#es3 .enum",el)); sec4()} refresh()})}

  /* 4 · final steps */
  function sec4(){const box=$("#es4",el); if(!open[3]()) return locked(box,4,"Final steps: "+rich(sv.title,SY),"Answer the questions above first.");
    const done=solveOK(), at=Math.min(E.sv.at,sv.steps.length); box.className="card esec"+(done?" done":"");
    const rows=[`<div class="lrow"><span class="lmath">${lineHTML(sv.start,SY)}</span><span class="lnote">${esc(sv.startNote||"start here")}</span></div>`];
    sv.steps.slice(0,at).forEach((s,i)=>{const o=s.opts.find(x=>x.ok); rows.push(`<div class="lrow ${i===at-1&&!E.sv.fin?"new":""}"><span class="lmath">${lineHTML(o.to||o.h.replace(/\{\{|\}\}/g,""),SY)}</span><span class="lnote">${rich(o.note||"",SY)}</span></div>`)});
    let cur="";
    if(at<sv.steps.length){const s=sv.steps[at], sel=E.sv.pick&&E.sv.pick[at];
      cur=`<div class="lstep"><p class="qtext"><b>Step ${at+1} of ${sv.steps.length}.</b> ${rich(s.q,SY)}</p><div class="choices moves" role="radiogroup">${s.opts.map((o,j)=>`<button type="button" class="choice ${sel===j?"wrong":""}" role="radio" aria-checked="${sel===j}" data-mv="${j}"><span class="k">${"ABCD"[j]}</span><span>${rich(o.h,SY)}</span></button>`).join("")}</div>
        ${sel!=null?`<p class="fb warn">${rich(s.opts[sel].fb||"That move doesn't get you closer. Try another.",SY)}</p>`:""}</div>`}
    else{const f=sv.final;
      cur=`<div class="lfinal"><p class="qtext">${rich(f.q,SY)}</p><div class="finrow">${f.inputs.map((x,j)=>`<label class="ufield inl finf" id="fw${j}"><span class="fpre">${rich(x.pre,SY)}</span><input data-fi="${j}" inputmode="decimal" placeholder="?" value="${esc(E.sv.ans[j]??"")}" aria-label="${esc(plain(rich(x.pre,SY))||"Answer")}"${E.sv.fin&&!S.teacher?" disabled":""}>${x.post?`<span>${esc(x.post)}</span>`:""}</label>`).join("")}
        ${E.sv.fin?"":`<button type="button" class="btn sm" id="fincheck">${ic("check",2.4)}Check</button>`}</div><p class="fb ${E.sv.fin?"good":""}" id="finfb">${E.sv.fin?rich(f.ok,SY):""}</p>
        ${E.sv.fin&&sv.interp?qHTML(sv.interp,E.sv.ip,"ip"):""}</div>`}
    box.innerHTML=head(4,"Final steps: "+rich(sv.title,SY),done,sv.intro?rich(sv.intro,SY):"")+`<div class="ledger">${rows.join("")}</div>${cur}`;
    $$("[data-mv]",box).forEach(b=>b.onclick=()=>{const s=sv.steps[at], j=+b.dataset.mv; st.runs=(st.runs||0)+1;
      if(s.opts[j].ok){E.sv.at=at+1; if(E.sv.pick) delete E.sv.pick[at]} else {E.sv.pick=E.sv.pick||{}; E.sv.pick[at]=j}
      save(); sec4(); refresh(); const nw=$(".lrow.new",box)||$(".lstep",box); if(nw&&!still()) nw.scrollIntoView({block:"nearest",behavior:"smooth"})});
    const fc=$("#fincheck",box); if(fc) fc.onclick=()=>{const f=sv.final, fbx=$("#finfb",box); let ok=true;
      f.inputs.forEach((x,j)=>{const inp=$(`[data-fi="${j}"]`,box), raw=inp.value.trim(), v=numOr(raw.replace(/[$,%\s]/g,""),NaN); E.sv.ans[j]=raw;
        const good=Number.isFinite(v)&&Math.abs(v-x.ans)<=(x.tol??Math.max(1e-9,Math.abs(x.ans)*.005)); $("#fw"+j,box).classList.toggle("bad",!good); $("#fw"+j,box).classList.toggle("ok",good); if(!good) ok=false});
      st.runs=(st.runs||0)+1;
      if(ok){E.sv.fin=true; save(); sec4(); celebrate($("#es4 .enum",el)||box,16); refresh()}
      else{fbx.className="fb warn"; fbx.innerHTML=rich(f.fb||"Not yet. Work it out from the last line above, then try again.",SY); save()}};
    $$("[data-fi]",box).forEach(inp=>inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&fc) fc.click()}));
    $$("[data-ip]",box).forEach(b=>b.onclick=()=>{E.sv.ip=+b.dataset.ip; st.runs=(st.runs||0)+1; save(); sec4(); refresh(); if(solveOK()) celebrate($("#es4 .enum",el))})}

function scatterSVG(pts,all){
  if(!pts.length) return `<p class="muted cempty">Nobody has started ${all?"a mission":"this mission"} yet.</p>`;
  const nar=innerWidth<600, W=nar?380:640,H=nar?300:330,L=nar?48:62,R=nar?12:18,T=16,B=nar?52:58, fs=nar?12:14, nice=m=>{const s=m<=10?2:m<=25?5:m<=60?10:m<=150?25:m<=300?50:100; return {max:Math.max(s,Math.ceil(m/s)*s),s}};
  const xs=nice(Math.max(...pts.map(p=>p.runs),1)), ys=nice(Math.max(...pts.map(p=>p.hints),1));
  const X=x=>L+x/xs.max*(W-L-R), Y=y=>H-B-y/ys.max*(H-T-B);
  let g=`<svg class="scat" viewBox="0 0 ${W} ${H}" role="img" aria-label="Model edits against hints used, one dot per student">`;
  for(let t=0;t<=ys.max;t+=ys.s) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="#EDE6E2" stroke-width="1"/><text x="${L-10}" y="${Y(t)+5}" text-anchor="end" font-size="${fs}" font-weight="600" fill="#606264">${t}</text>`;
  for(let t=0;t<=xs.max;t+=xs.s) g+=`<line y1="${T}" y2="${H-B}" x1="${X(t)}" x2="${X(t)}" stroke="#EDE6E2" stroke-width="1"/><text x="${X(t)}" y="${H-B+22}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#606264">${t}</text>`;
  g+=`<text x="${(L+W-R)/2}" y="${H-10}" text-anchor="middle" font-size="${fs+1}" font-weight="700" fill="#17171C">model edits</text><text transform="translate(${nar?13:16} ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="${fs+1}" font-weight="700" fill="#17171C">hints used</text>`;
  const seen={}; [...pts].sort((a,b)=>(a.fin?0:1)-(b.fin?0:1)).forEach(p=>{const k=p.runs+":"+p.hints, n=seen[k]=(seen[k]||0)+1, dx=n>1?((n%2?1:-1)*Math.ceil((n-1)/2)*7):0;
    const cx=X(p.runs)+dx, cy=Y(p.hints), c=p.fin?"#B8B0AB":"#6243D2";
    g+=`<g class="pt" tabindex="0" data-tip="${esc(`<b>${esc(nameOf(p.s))}</b><br>${p.runs} edits · ${p.hints} hints<br>${p.fin?(all?"Finished every mission":"Finished"):"Still working"}`)}"><circle cx="${cx}" cy="${cy}" r="13" fill="transparent"/><circle cx="${cx}" cy="${cy}" r="6" fill="${c}" stroke="#FEF9F6" stroke-width="2"/></g>`});
  return g+`</svg>`}
function studentModal(s,ms){if(!s) return;

      const ans=x&&x.answers?Object.entries(x.answers).filter(([k])=>lbl[k]).map(([k,a])=>`<div class="sans"><b>${lbl[k]}</b><p>${esc(a)}</p></div>`).join(""):"";
      return `<div class="sdm"><div class="sdh"><span class="lvpill" style="background:${LVC[l]};color:${LVT[l]}">${LV[l]}</span><b>${esc(m.title)}</b></div>
        ${x&&l?`<dl class="kv"><dt>Model edits</dt><dd>${x.runs||0}</dd><dt>Hints used</dt><dd>${x.hints||0}</dd><dt>Goals done</dt><dd>${x.goalsDone||0} / ${x.goalsTotal||"—"}</dd>${x.passed!=null?`<dt>Checks passed</dt><dd>${x.passed}</dd>`:""}${x.goal&&!x.done?`<dt>Working on</dt><dd>${esc(x.goal)}</dd>`:""}</dl>${ans}
        ${(()=>{const dgs=s.state&&s.state[m.id]&&s.state[m.id].d&&s.state[m.id].d.dg, b=[];
          if(dgs&&MISSIONS[m.id]&&dgSpecOf(MISSIONS[m.id])) b.push(`<button class="btn sm white" data-sd="${esc(m.id)}">${ic("diagram",2.2)}Show their diagram</button>`);
          if(prog&&prog.body&&prog.body.length) b.push(`<button class="btn sm white" data-sm="${esc(m.id)}">${ic("code",2.2)}Show their model</button>`);
          return b.length?`<div class="sbtns">${b.join("")}</div><div class="smodel" id="sd-${esc(m.id)}" hidden></div><div class="smodel" id="sm-${esc(m.id)}" hidden></div>`:s.sample?`<p class="muted" style="font-size:1.7rem">Sample students have no diagram or block model to show.</p>`:""})()}`:`<p class="muted">Not started yet.</p>`}</div>`}).join("")}</div>`);
  md.el.classList.add("wide");
  $$("[data-sm]",md.el).forEach(b=>b.onclick=()=>{const id=b.dataset.sm, box=$("#sm-"+CSS.escape(id),md.el), st=s.state[id], prog=st.d.prog;
    if(!box.hidden){box.hidden=true; b.lastChild.textContent="Show their model"; return}
    const hat=id==="fire"?`<div class="blk hat fhat"><i class="hf"></i>${FLAG}<span>each step, every square writes to</span><span class="bsel fake">${st.d.mode==="inplace"?"the same forest":st.d.mode==="next"?"a fresh copy":"(not chosen)"}</span></div>`:HAT;
    box.innerHTML=`<div class="canvasbox card ro"><div class="script">${hat}<div class="stack root">${prog.body.map(n=>rNode(n,{pal:true,show:true,vars:{},menus:()=>[]})).join("")}</div></div></div>`;
    box.hidden=false; b.lastChild.textContent="Hide their model"});
  $$("[data-sd]",md.el).forEach(b=>b.onclick=()=>{const id=b.dataset.sd, box=$("#sd-"+CSS.escape(id),md.el), spec=dgSpecOf(MISSIONS[id]), D=s.state[id].d.dg||{};
    if(!box.hidden){box.hidden=true; b.lastChild.textContent="Show their diagram"; return}
    const v=dgViewOf(spec,D), done=!!D.done, errs=dgErrList(spec,D);
    box.innerHTML=`<p class="muted sdnote">${done?"Finished.":"Not finished yet: this is how far they got. Shapes they haven't placed yet show as dashed boxes."}</p><div class="dgstatic"><div class="dgcanvas">${dgSVG(spec,spec.L.wide,v,{aria:dgAria(spec,v)})}</div></div>
      ${errs.length?`<div class="sderr"><b>Tried along the way</b><p>${errs.map(esc).join(" · ")}</p></div>`:""}`;
    box.hidden=false; b.lastChild.textContent="Hide their diagram"});
  tipBind(md.el)}

  $$("[data-mpx]",main).forEach(b=>b.onclick=()=>{const kk=b.dataset.mpx, P=ED.p.practices; ED.p.practices=P.includes(kk)?P.filter(x=>x!==kk):[...P,kk]; b.setAttribute("aria-pressed",ED.p.practices.includes(kk)); edChanged(v)});
  $$("[data-addvar]",main).forEach(b=>b.onclick=()=>{const kind=b.dataset.addvar, n=ED.p.vars.filter(x=>x.kind===kind).length+1, key={in:"x",par:"c",out:"y"}[kind]+(n>1?n:"");
    ED.p.vars.push(kind==="in"?{key,name:"",unit:"",kind,min:0,max:10,step:1,start:5}:kind==="par"?{key,name:"",unit:"",kind,val:0}:{key,name:"",unit:"",kind,formula:""}); edChanged(v,true)});
  $$("[data-delvar]",main).forEach(b=>b.onclick=()=>{ED.p.vars.splice(+b.dataset.delvar,1); edChanged(v,true)});
  $$("[data-kind]",main).forEach(s=>s.onchange=()=>{const x=ED.p.vars[+s.dataset.kind]; x.kind=s.value; if(s.value==="out"&&!x.formula) x.formula=""; edChanged(v,true)});
  $("#ed-addas",main).onclick=()=>{ED.p.assumptions.push({t:"",ok:true,sug:false,why:""}); edChanged(v,true)};
  $$("[data-delas]",main).forEach(b=>b.onclick=()=>{ED.p.assumptions.splice(+b.dataset.delas,1); edChanged(v,true)});
  $$("[data-aok],[data-anok]",main).forEach(b=>b.onclick=()=>{const i=+(b.dataset.aok??b.dataset.anok), a=ED.p.assumptions[i]; a.ok=b.dataset.aok!=null; if(!a.ok) a.sug=false; edChanged(v,true)});
  $$("[data-asug]",main).forEach(c=>c.onchange=()=>{ED.p.assumptions[+c.dataset.asug].sug=c.checked; edChanged(v)});
  const st=$("#ed-srctext",main); if(st) st.onclick=()=>{const pre=$("#ed-srcpre",main); pre.hidden=!pre.hidden; st.textContent=pre.hidden?"show its text":"hide its text"}}
function bindEditor(v){bindForm(v); const root=$(".wsedit",v);
  root.addEventListener("input",e=>{const el=e.target.closest("[data-f]"); if(!el||!ED) return; const path=el.dataset.f; let val=el.value;
    if(el.dataset.t==="num"){const n=numOr(val,NaN); if(!Number.isFinite(n)) return; val=n}
    if(path.startsWith("key.")) ED.keyTouched=true;
    setPath(ED,path,val); edChanged(v)});
  root.addEventListener("change",e=>{const el=e.target.closest("[data-key]"); if(!el||!ED) return; const i=+el.dataset.key, x=ED.p.vars[i], old=x.key, nk=normKey(el.value)||old;
    if(ED.p.vars.some((y,j)=>j!==i&&y.key===nk)){toast(`There's already a variable called ${esc(nk)}.`); el.value=old; x.key=old; return}
    x.key=nk; ED.p.goals.forEach(g=>{if(g.out===old) g.out=nk}); edChanged(v,true)});
  $("#ed-save",v).onclick=()=>edSave(v);
  $("#ed-pub",v).onclick=async()=>{const pub=ED.p.status==="published";
    if(!pub){const iss=problemIssues(normProblem(ED.p)); if(iss.length){toast(`Fix this first: ${esc(iss[0])}`,4200); return}}
    ED.p.status=pub?"draft":"published"; await edSave(v,pub?"Unpublished. Students can't see it now.":"Published. Students can play it now."); renderEditor(ED.p.id,v)};
  $("#ed-prev",v).onclick=()=>{MISSIONS["p-"+ED.p.id]=customMission(normProblem(ED.p)); go("p-"+ED.p.id)};
  const rv=$("#ed-revert",v); if(rv) rv.onclick=()=>{wsDropBackup(ED.p.id); ED=null; renderEditor(location.hash.slice(4),v)};
  const box=$("#edstat",v);
  const ask=async instr=>{const snap={p:JSON.parse(JSON.stringify(ED.p)),key:JSON.parse(JSON.stringify(ED.key))};
    const r=await runAI(box,"Working on your problem…",aiRevisePrompt(normProblem(ED.p),ED.key,instr)); if(!r) return;
    const {p,key}=splitAI(r); if(!p.vars.length){aiDone(box,"The AI's answer was missing its variables, so nothing changed.","err"); return}
    ["id","status","createdAt","author","source"].forEach(f=>p[f]=ED.p[f]); ED.undo.push(snap); ED.p=p;
    ED.key=Object.assign({},ED.key,{solution:key.solution,explainAnswer:key.explainAnswer||ED.key.explainAnswer,notes:ED.key.notes}); ED.keyTouched=true;
    ED.notes=key.notes||"The AI updated your problem. Check it before you publish."; ED.dirty=true; wsBackup(); renderEditor(ED.p.id,v)};
  const INSTR={fill:"Fill in everything that's missing or empty (variables' names and units, formulas, assumptions, goals and three hints per output, step tips, the explain question and answer, the solution). Keep everything that's already written.",
    hints:"Write or improve the goal text and three hints for every output, each more specific than the last: hint 1 asks a question and works one small case with the story's numbers; hint 2 states the relationship in words and as a formula using the variable keys; hint 3 is numbered steps (1. 2. 3.) naming each block and where it goes, ending with a value to check in the console. Also write one short tip for each step.",
    easier:"Make the problem easier for the same grade: fewer steps, friendlier numbers, simpler outputs. Keep the same context.",
    harder:"Make the problem harder for the same grade: add a step, a second output to compare, or a decision that needs the model. Keep the same context."};
  $$("[data-ai]",v).forEach(b=>b.onclick=async()=>{const kk=b.dataset.ai;
    if(kk==="check"){const r=await runAI(box,"Checking your problem…",aiCheckPrompt(normProblem(ED.p),ED.key)); if(!r) return;
      const iss=(Array.isArray(r.issues)?r.issues:[]).map(x=>str(x,300)).filter(Boolean);
      aiDone(box,`${r.praise?`<p class="edp"><b>${esc(str(r.praise,300))}</b></p>`:""}${iss.length?`<ul class="issues">${iss.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:`<p class="edp">The AI found nothing to fix.</p>`}`,"ok"); return}
    ask(INSTR[kk])});
  $("#ai-go",v).onclick=()=>{const t=$("#ai-ask",v).value.trim(); if(!t){$("#ai-ask",v).focus(); return} ask(t)};
  const un=$("#ai-undo",v); if(un) un.onclick=()=>{const s=ED.undo.pop(); if(!s) return; ED.p=s.p; ED.key=s.key; ED.notes=""; ED.dirty=true; wsBackup(); renderEditor(ED.p.id,v)}}
async function edSave(v,msg){if(!ED) return; const btn=$("#ed-save",v); btn.disabled=true;
  try{const writeKey=ED.isNew||ED.keyLoaded||ED.keyTouched; const p=await saveProblem(ED.p,writeKey?ED.key:null); ED.p=p; ED.dirty=false; ED.isNew=false; ED.keyLoaded=true; ED.hadBackup=false; wsDropBackup(p.id);
    const s=$("#ed-saved",v); if(s) s.textContent="All changes saved"; toast(msg||"Saved.")}
  catch(e){toast(e&&e.code==="quota_exceeded"?"The class's storage is full. Delete old problems, then try again.":"Couldn't save. Try again.",4200)}
  finally{btn.disabled=false}}
cloudOn("keys",()=>{if(ED&&!ED.keyLoaded&&!ED.keyTouched&&Cloud.keys[ED.p.id]){ED.key=JSON.parse(JSON.stringify(Cloud.keys[ED.p.id])); ED.keyLoaded=true; if(location.hash==="#ws-"+ED.p.id) renderEditor(ED.p.id,$("#view"))}});

/* ---------- keep open pages current as class data arrives ---------- */
function refreshWsList(){const box=$("#view .wslist"); if(!box) return; const v=$("#view"), un=wsUnsaved(), list=Object.values(Cloud.problems).sort((a,b)=>b.updatedAt-a.updatedAt);
  Object.keys(un).forEach(id=>{if(!Cloud.problems[id]) list.unshift(Object.assign(normProblem(un[id].p),{_unsaved:true}))});
  box.innerHTML=`<div class="dh"><h3>Your problems</h3><span class="muted">${list.length} problem${list.length===1?"":"s"}</span></div>${list.length?`<div class="plist2">${list.map(probRow).join("")}</div>`:`<p class="muted cempty">No problems yet. Upload a file, draft one with AI, or start from scratch.</p>`}`;
  $$("[data-pact]",box).forEach(b=>b.onclick=()=>probAction(b.dataset.pact,b.dataset.pid,b,v))}
const curRoute=()=>(location.hash||"").slice(1)||"home";
cloudOn("problems",()=>{const r=curRoute(), v=$("#view");
  if(r==="challenges"){renderChallenges(v); enhance(v)}
  else if(r==="workspace") refreshWsList();
  else if(r==="class") renderClass(v,true);
  else if((r.startsWith("p-")&&$("#view .pending"))||(r.startsWith("ws-")&&!$("#view .wsedit"))) route()});
cloudOn("progress",()=>{if(curRoute()==="class") renderClass($("#view"),true)});
cloudOn("ready",()=>{const r=curRoute(); if(["options","class","workspace","analytics"].includes(r)||r.startsWith("ws-")||(r.startsWith("p-")&&$("#view .pending"))) route()});
["slow","err"].forEach(n=>cloudOn(n,()=>{const r=curRoute(); if(r==="class") renderClass($("#view"),true); else if(r.startsWith("p-")&&$("#view .pending")) route()}));
cloudOn("sync",()=>{const c=$("#view .synccard"); if(c) c.outerHTML=syncCard()});
cloudOn("config",()=>{const h=$("#set-hints"); if(h) h.checked=Cloud.config.hints!==false});

/* ================= motion & play layer =================
   Hackathon-site style interactions layered over the static mockup visuals:
   floating/parallax decorations, staggered pop-ins, count-up stats, scroll reveals,
   talking mascots, confetti bursts, tilt-on-hover cards and a springy logo.
   Everything is skipped when the visitor prefers reduced motion. */
const RM=matchMedia("(prefers-reduced-motion: reduce)");
const still=()=>RM.matches;
document.documentElement.classList.add("js-motion");

/* count-up numbers: <span data-count="11460" data-dec="0"> */
function countUp(el){const to=+el.dataset.count, dec=+(el.dataset.dec||0); if(!Number.isFinite(to)) return;
  if(still()){el.textContent=fmt(to,dec); return}
  const t0=performance.now(), D=+(el.dataset.ms||(to>100?1300:700));
  const tick=now=>{const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,4); el.textContent=fmt(to*e,dec); if(k<1&&el.isConnected) requestAnimationFrame(tick)};
  el.textContent=fmt(0,dec); requestAnimationFrame(tick)}

/* reveal-on-scroll and count-when-visible */
let IO=null;
function watch(el){
  if(el.dataset.count==null&&el.getBoundingClientRect().top<innerHeight) return;
  if(still()||!("IntersectionObserver" in window)){if(el.dataset.count!=null) countUp(el); return}
  if(!IO) IO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting) return; const t=e.target; IO.unobserve(t); t.dataset.count!=null?countUp(t):t.classList.add("in")}),{threshold:.12,rootMargin:"0px 0px -4% 0px"});
  IO.observe(el)}

/* pointer parallax for decorations (like floating planets on hackathon sites) */
let PX=0,PY=0,praf=0;
function parallax(){praf=0; $$("#view [data-depth]").forEach(el=>{const d=+el.dataset.depth; el.style.translate=`${(-PX*d).toFixed(2)}rem ${(-PY*d).toFixed(2)}rem`})}
addEventListener("pointermove",e=>{if(still()||e.pointerType==="touch") return; PX=e.clientX/innerWidth-.5; PY=e.clientY/innerHeight-.5; if(!praf) praf=requestAnimationFrame(parallax)},{passive:true});

/* confetti burst in the palette, outlined like everything else */
const BURST=["#FDE14D","#FD98A8","#7DF0C7","#CFA8FA","#8ED0FD","#FD9374"];
function burst(x,y,n=28,spread=1){
  if(still()) return;
  for(let i=0;i<n;i++){const s=document.createElement("span"); s.className="cf"; const sz=9+Math.random()*9, shape=i%3;
    s.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${shape===2?sz*.55:sz}px;background:${BURST[i%BURST.length]};border-radius:${shape===1?"50%":"3px"}`;
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2, v=(120+Math.random()*200)*spread, dx=Math.cos(a)*v, dy=Math.sin(a)*v*.8-120*spread, rot=(Math.random()-.5)*900;
    const an=s.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:1},
      {transform:`translate(calc(-50% + ${dx*.62}px),calc(-50% + ${dy*.62}px)) rotate(${rot*.5}deg) scale(1)`,opacity:1,offset:.42},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+240}px)) rotate(${rot}deg) scale(.85)`,opacity:0}],
      {duration:1100+Math.random()*600,easing:"cubic-bezier(.15,.7,.35,1)"});
    an.onfinish=()=>s.remove()}}
function celebrate(el,n=30){if(!el) return; const r=el.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,n)}

/* talking mascots: click (or Enter) for a tip */
const TALK_ANY=["Models are simplifications. That's their superpower!","Test it before you trust it.","A wrong prediction is still useful data.","Change one thing at a time!","If a check fails, the model just got better."];
const TALK_PAGE={home:["Hi! Ready to model something?","Tap the yellow button to start a mission!","Every model starts with a question."],challenges:["Pick a mission!","Each one takes ~30 min.","Build, test, explain!","Finish one for a badge!"]};
function talkPool(){const r=(location.hash||"").slice(1); return (MISSIONS[r]&&MISSIONS[r].talk)||TALK_PAGE[r]||TALK_ANY}
function pick(pool,not){let t,g=0; do{t=pool[(Math.random()*pool.length)|0]}while(t===not&&pool.length>1&&g++<8); return t}
function sayNear(b){
  const host=b.offsetParent||b.parentElement; if(!host) return;
  const near=host.querySelector(":scope > .bubble");
  if(near&&host.contains(b)){const sp=near.firstChild; const t=pick(talkPool(),sp&&sp.textContent); if(sp&&sp.nodeType===3) sp.textContent=t; else near.insertAdjacentText("afterbegin",t);
    near.classList.remove("pop"); void near.offsetWidth; near.classList.add("pop"); return}
  $$(".say",host).forEach(x=>x.remove());
  const d=document.createElement("div"); d.className="say"; d.setAttribute("role","status"); d.textContent=pick(talkPool());
  const rem=parseFloat(getComputedStyle(document.documentElement).fontSize);
  const x=b.offsetLeft+b.offsetWidth*(+(b.dataset.sx||.62)), y=b.offsetTop+b.offsetHeight*(+(b.dataset.sy||0))-1.2*rem;
  d.style.left=x+"px"; d.style.top=y+"px"; host.appendChild(d);
  const hr=host.getBoundingClientRect();
  if(b.dataset.flip||hr.left+x+d.offsetWidth>innerWidth-12){d.classList.add("flip"); d.style.left=Math.max(4,b.offsetLeft+b.offsetWidth*(+(b.dataset.fx||.38))-d.offsetWidth)+"px"}
  const top=hr.top+y-d.offsetHeight; if(top<8) d.style.top=(y+(8-top))+"px";
  setTimeout(()=>{d.classList.add("out"); setTimeout(()=>d.remove(),300)},3400)}
function bindTalk(b){if(b.dataset.talk) return; b.dataset.talk="1";
  if(b.tagName==="IMG"){b.setAttribute("role","button"); b.tabIndex=0; if(!b.getAttribute("aria-label")) b.setAttribute("aria-label","ModelQuest bear: tap for a tip")}
  const go=()=>{b.classList.remove("hop"); void b.offsetWidth; b.classList.add("hop"); sayNear(b)};
  b.addEventListener("click",go); b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault(); go()}})}

/* tilt-on-hover for challenge cards */
function bindTilt(c){if(c.dataset.tilt) return; c.dataset.tilt="1";
  c.addEventListener("pointermove",e=>{if(still()||e.pointerType==="touch") return; const r=c.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    c.style.transform=`perspective(90rem) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg) translate(-.2rem,-.25rem)`});
  c.addEventListener("pointerleave",()=>{c.style.transform=""})}

/* a disabled Next/Submit that becomes ready does a small hop */
new MutationObserver(ms=>ms.forEach(m=>{const b=m.target; if(m.oldValue!==null&&!b.disabled&&b.matches(".btn.next,.btn.submit,#go2,#nextb,#twgo")){b.classList.remove("ready"); void b.offsetWidth; b.classList.add("ready")}}))
  .observe(document.body,{subtree:true,attributes:true,attributeFilter:["disabled"],attributeOldValue:true});

/* ModelQuest cube does a flip when you head home */
document.addEventListener("click",e=>{const br=e.target.closest(".brand"); if(!br) return; const s=$("svg",br); if(!s||still()) return; s.classList.remove("flip"); void s.getBoundingClientRect(); s.classList.add("flip")});

/* run after every render */
function enhance(root){
  $$("[data-stagger]",root).forEach(g=>[...g.children].forEach((c,i)=>{c.style.setProperty("--i",i); c.classList.add("pop-in")}));
  $$(".reveal,[data-count]",root).forEach(watch); fitInl(root);
  $$("[data-fill]",root).forEach(f=>{if(still()) return; const to=f.dataset.fill; f.style.width="0%"; requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.width=to}))});
  $$(".deco",root).forEach((d,i)=>{if(!d.dataset.depth) d.dataset.depth=(0.9+((i*37)%10)*0.17).toFixed(2); d.style.setProperty("--dl",(-(i*1.37)%5.5).toFixed(2)+"s")});
  $$(".blob",root).forEach(b=>{if(!b.dataset.depth&&!b.classList.contains("lblob")) b.dataset.depth=".3"});
  $$(".talk,.talkart",root).forEach(bindTalk);
  $$("button.ccard",root).forEach(bindTilt);
  const cur=$(".navlink[aria-current='page']"); if(cur&&!still()){cur.classList.remove("pop"); void cur.offsetWidth; cur.classList.add("pop")}
  if(PX||PY) parallax();
}

/* ================= boot ================= */
$("#logo").outerHTML=LOGO.replace('<svg','<svg width="40" height="40"');
hydrateIcons(document);
applyRole();
route();
cloudInit();

</script>
